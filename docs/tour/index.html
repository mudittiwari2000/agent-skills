<style>
/* Layout: a delivery pipeline. Five stage lanes across the top act as the filter;
   skills sit under their stage; a detail panel opens beside the grid (below on phones). */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5b6874;
  --line: #d8dfe4;
  --accent: #0f6e78;        /* pipeline teal */
  --accent-soft: #e1f0f1;
  --ready: #2f7d4f;  --ready-bg: #e3f2e8;
  --partial: #9a6a12; --partial-bg: #f7eedb;
  --org: #8a3b3b;    --org-bg: #f6e4e4;
  --plan: #6b5aa6; --build: #2f6fb3; --review: #0f6e78; --ship: #b0611d; --operate: #8a3b56;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171c; --surface: #19222a; --ink: #e6ecf0; --muted: #9aa8b3; --line: #2b3640;
  --accent: #4fb6c0; --accent-soft: #173238;
  --ready: #7cc796; --ready-bg: #1b3326; --partial: #e1b660; --partial-bg: #382c14; --org: #e39a9a; --org-bg: #3a2222;
  --plan: #a99ae0; --build: #7fb0e6; --review: #4fb6c0; --ship: #e6a066; --operate: #d98aa6;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171c; --surface: #19222a; --ink: #e6ecf0; --muted: #9aa8b3; --line: #2b3640;
  --accent: #4fb6c0; --accent-soft: #173238;
  --ready: #7cc796; --ready-bg: #1b3326; --partial: #e1b660; --partial-bg: #382c14; --org: #e39a9a; --org-bg: #3a2222;
  --plan: #a99ae0; --build: #7fb0e6; --review: #4fb6c0; --ship: #e6a066; --operate: #d98aa6;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: .86em; }
.lede { color: var(--muted); max-width: 64ch; margin-top: 10px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; color: var(--muted); font-size: .9rem; }
nav.tabs { display: flex; gap: 4px; margin: 26px 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font: 600 .95rem var(--body); color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.lane { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; text-align: left; cursor: pointer; font: inherit; color: inherit; position: relative; }
.lane::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 6px 0 0 6px; background: var(--c); }
.lane b { display: block; font-family: var(--display); font-size: .98rem; }
.lane span { color: var(--muted); font-size: .8rem; }
.lane[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar input { flex: 1 1 240px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 600 .82rem var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 18px; align-items: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: inherit; }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .name { font-family: var(--mono); font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; }
.stage-dot { font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; color: var(--c); font-weight: 600; white-space: nowrap; }
.card .pitch { color: var(--muted); font-size: .93rem; }
.pill { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: .75rem; font-weight: 600; }
.pill.ready { color: var(--ready); background: var(--ready-bg); }
.pill.partial { color: var(--partial); background: var(--partial-bg); }
.pill.org { color: var(--org); background: var(--org-bg); }
.needs { display: flex; flex-wrap: wrap; gap: 4px; }
.needs span { font-size: .74rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
aside.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 24px); overflow: auto; }
.detail .label { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.prompt { display: flex; gap: 8px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
.prompt code { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; font: 600 .78rem var(--body); padding: 3px 8px; cursor: pointer; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; }
.chain button { font-family: var(--mono); font-size: .8rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.muted { color: var(--muted); }
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; overflow-x: auto; }
.flowsteps { display: grid; gap: 10px; margin-top: 14px; }
.flowstep { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: start; }
.flowstep .n { font: 600 .82rem var(--mono); color: var(--accent); padding-top: 2px; }
.road { display: grid; gap: 14px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.phase header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; margin-bottom: 10px; }
.phase .when { font: 600 .82rem var(--mono); color: var(--muted); }
.task { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task .box { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; margin-top: 4px; }
.task.done .box { background: var(--ready); border-color: var(--ready); }
.task.done .t { color: var(--muted); text-decoration: line-through; }
.task .why { color: var(--muted); font-size: .88rem; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 6px; }
.steps { counter-reset: s; display: grid; gap: 12px; max-width: 760px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 8px; }
.empty { color: var(--muted); padding: 24px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }
footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.detail { position: static; max-height: none; }
  .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .card, .lane, .chip { transition: border-color .15s, box-shadow .15s; } }
</style>

<script>
const DATA = {"asOf":"2026-10-30","repo":"https://github.com/mudittiwari2000/agent-skills","intro":"Grounded engineering-workflow skills for AI coding agents. Each one checks claims against the real code, pipeline or ticket before it reports, and leaves the judgement calls (and anything sent to other people) to you. Pick a stage to see the skills for that part of delivery, or search for a tool or task.","harnesses":["Claude Code","Codex","any harness that reads SKILL.md"],"readiness":{"ready":{"label":"Generic","hint":"Works for anyone with git and the named tool; no private overlay needed."},"partial":{"label":"GitLab + Jira today","hint":"The method is generic, but forge, tracker or chat calls are wired to GitLab, Jira or Slack. Generalising is on the roadmap."},"org":{"label":"Fits one setup","hint":"Written around one team's CI and release process; needs a rework before others can use it."}},"stages":[{"id":"plan","label":"Plan","blurb":"Specs and estimates"},{"id":"build","label":"Build","blurb":"Scope and skill dev"},{"id":"review","label":"Review","blurb":"MRs and comments"},{"id":"ship","label":"Ship","blurb":"Deploys and flags"},{"id":"operate","label":"Operate","blurb":"Incidents and alerts"}],"flow":{"title":"One change, end to end","intro":"How the skills hand off across a typical change. Each arrow is a point where the next skill picks up what the last one produced.","mermaid":"flowchart LR\n  A[jira-story-estimation] --> B[scope-audit]\n  B --> C[MR opened]\n  C --> D[mr-review-request]\n  D --> E[mr-review / guided-mr-review]\n  E --> F[mr-comment-resolution]\n  F --> G[merge]\n  G --> H[monitor-dev-ci]\n  H --> I[release tag]\n  I --> J[monitor-stage-ci]\n  J --> K[prod-flag-ledger]\n  K --> L[prod]\n  L -. incident .-> M[rca-report]\n  D -. drafts via .-> N[agent-alerts]\n  J -. drafts via .-> N","steps":["Estimate the story from its acceptance criteria and the real code (jira-story-estimation). Review the spec first if there is one (confluence-review).","Before opening the MR, check that every hunk is needed (scope-audit).","When the MR opens, get a review request drafted with reviewers from related work, and send it yourself (mr-review-request, through agent-alerts).","Reviewers use mr-review for a full review, or guided-mr-review to do it themselves.","Answer every finding with a verdict and a fix, a ticket or a reason (mr-comment-resolution).","After the merge, follow it to dev and get the release tag (monitor-dev-ci), then to stage with the testing request prepared (monitor-stage-ci).","On release day, find the flags that must go on in prod (prod-flag-ledger). If something breaks, investigate it to a root cause (rca-report)."]},"roadmap":{"intro":"Goal: make every skill useful to an engineer on any stack, then get it in front of people. One step a day; ticks are updated as each lands.","phases":[{"title":"Day 0: tour and inventory","when":"16 Oct 2026","goal":"Know where each skill stands, and make that visible.","tasks":[{"title":"Interactive skills tour, generated from the repo","why":"One page that explains every skill; rebuilt by scripts/build-tour.py.","done":true},{"title":"Pre-commit check that fails when the tour is stale","why":"The tour can't silently drift from the skills.","done":true},{"title":"Genericity audit of all 13 skills and a distribution scan","why":"Feeds the readiness badges and this roadmap.","done":true},{"title":"README skills table lists every skill","why":"agent-alerts and mr-review-request were missing.","done":true}]},{"title":"Day 1: first impressions","when":"17 Oct 2026","goal":"Someone landing on the repo can install it in their harness in under a minute.","tasks":[{"title":"Per-harness install blocks in the README","why":"Claude Code plugin, npx skills add, Codex, Gemini CLI, Copilot, glab skills install."},{"title":"Update the GitHub description and topics","why":"Today it says Codex-only; add claude-code, agent-skills, gitlab, code-review."},{"title":"Pass claude plugin validate --strict","why":"Required for the Anthropic directory."},{"title":"Stop doctor.sh failing for normal users","why":"Make Jira optional in mr-review's manifest; check the contributor hook only in contributor mode."}]},{"title":"Days 2–3: setup that asks what you have","when":"18–19 Oct 2026","goal":"Setup adapts to the user's stack instead of assuming one.","tasks":[{"title":"Capability manifest for every skill","why":"Declares the forge, CI, tracker, chat, docs and CLI tools each one requires or can use."},{"title":"Interactive setup.sh","why":"Asks for forge and host, CI, tracker, docs, chat, cloud access and flag provider, writes a non-secret config, checks gh/glab auth."},{"title":"doctor.sh reports readiness per skill","why":"Ready, partly ready (and what's skipped), or not available."},{"title":"Degrade rules in every skill","why":"No tracker: spec file. No chat: terminal with paste-ready text. Always say what was skipped."}]},{"title":"Days 4–8: GitHub support","when":"20–24 Oct 2026","goal":"The review skills work on GitHub PRs as well as GitLab MRs.","tasks":[{"title":"lib/forge.py: one forge layer for GitLab and GitHub, picked from the remote","why":"Unlocks seven skills; the biggest single lever."},{"title":"mr-review and guided-mr-review on GitHub","why":"gh pr view, refs/pull/N/head, review comments with a commit SHA."},{"title":"mr-comment-resolution on GitHub","why":"Including resolving review threads through GraphQL."},{"title":"mr-review-request on GitHub, with CODEOWNERS as a reviewer signal","why":"gh pr edit --add-reviewer, gh pr ready."}]},{"title":"Days 9–10: trackers, docs and output","when":"25–26 Oct 2026","goal":"Jira, Confluence and Slack become one option each, not requirements.","tasks":[{"title":"Tracker adapter: Jira, Linear, GitHub Issues or none","why":"Rename jira-story-estimation to story-estimation."},{"title":"confluence-review becomes doc-review","why":"Confluence, Notion, Google Docs, Markdown in the repo."},{"title":"Terminal-first output with optional publishers","why":"rca-report defaults to Markdown when no document tool exists."},{"title":"agent-alerts notifier adapters","why":"Slack, Discord, Teams, ntfy, email or terminal-only."}]},{"title":"Days 11–13: one deploy monitor","when":"27–29 Oct 2026","goal":"Deploy monitoring that fits any CI and versioning scheme.","tasks":[{"title":"Merge monitor-dev-ci and monitor-stage-ci into monitor-deploy --env","why":"They already share their layout."},{"title":"CI adapter: GitLab CI and GitHub Actions","why":"gh run list --commit, gh run watch."},{"title":"Version-source adapter","why":"package.json, pyproject, Cargo, VERSION file, or tags only."},{"title":"Pluggable live checks; move one team's specifics to the overlay","why":"HTTP version endpoint, k8s image tag, parameter store."}]},{"title":"Day 14: launch","when":"30 Oct 2026","goal":"Put it in front of people with something they can try.","tasks":[{"title":"Clean the public text","why":"Internal workflow names out; revision diaries move to a CHANGELOG."},{"title":"examples/ with real sample outputs","why":"An MR review report, an RCA, a scope audit."},{"title":"Submit to the Anthropic plugin directory","why":"claude.ai/directory/manage (needs a paid plan)."},{"title":"Post in r/ClaudeCode and the r/ClaudeAI showcase thread","why":"Lead with the GitLab + Jira angle, where few skills exist."},{"title":"Publish the tour on GitHub Pages","why":"docs/tour/index.html is already a standalone page."}]},{"title":"Weeks 3–4: momentum","when":"From 31 Oct 2026","goal":"Keep the repo active and give people a reason to come back.","tasks":[{"title":"Submit to awesome-claude-code","why":"Its form needs 14+ days of active commits."},{"title":"First new generic skill: ci-failure-triage","why":"Every team sifts red pipelines."},{"title":"An eval for mr-review (with vs without the skill)","why":"Evidence for a Show HN post."},{"title":"One new or generalised skill a week","why":"From the Next skills tab."}]}]},"ideas":[{"name":"ci-failure-triage","stage":"ship","why":"Fetch the failing job's log, re-run at the target branch as a baseline, and classify the failure as infra, code or flaky.","works":"GitLab CI, GitHub Actions"},{"name":"flaky-test-triage","stage":"build","why":"Loop the test, find what it depends on (order, time, network) and propose a quarantine plus a fix.","works":"any test runner"},{"name":"regression-bisect","stage":"operate","why":"Drive git bisect run from a reproducing script, so \"it used to work\" becomes a commit.","works":"git"},{"name":"dependency-upgrade","stage":"build","why":"Read the changelog's breaking changes, check every call site, run the suites against a baseline.","works":"npm, pip, cargo, go"},{"name":"release-notes-from-git","stage":"ship","why":"Turn a tag range into user-facing notes from merged MRs and PRs, with git as the source of truth.","works":"GitLab, GitHub"},{"name":"migration-safety-review","stage":"review","why":"Check database migrations for locks, backfills, rollback and old code against the new schema.","works":"SQL migrations, ORMs"},{"name":"feature-flag-cleanup","stage":"ship","why":"Find stale flags in code and in the ledger, then draft the removal change. Pairs with prod-flag-ledger.","works":"any flag provider"},{"name":"pr-description-audit","stage":"review","why":"Write or check an MR description against the diff and its real call sites.","works":"GitLab, GitHub"},{"name":"repo-onboarding-tour","stage":"plan","why":"A grounded tour of a repo for a newcomer: entry points, how to run the checks, the traps.","works":"any repo"}],"start":[{"title":"Install as a Claude Code plugin","text":"Adds the repo as a plugin marketplace and installs every skill. Run both lines inside Claude Code.","cmd":"/plugin marketplace add mudittiwari2000/agent-skills\n/plugin install agent-skills@mudit-agent-skills"},{"title":"Or clone and link into every harness","text":"Links the skills into Claude Code, Codex and any other harness it detects. Run with --dry-run first to preview.","cmd":"git clone https://github.com/mudittiwari2000/agent-skills.git ~/dev/repos/agent-skills\nbash ~/dev/repos/agent-skills/install.sh"},{"title":"Check what works on your machine","text":"Reports what's set up and names the command that fixes anything that isn't.","cmd":"bash ~/dev/repos/agent-skills/doctor.sh --offline"},{"title":"Try one","text":"Start with a generic skill: a scope audit on any branch with a spec, or a review of a GitLab MR.","cmd":"Run a scope audit of this branch against SPEC.md"}],"skills":[{"name":"agent-alerts","description":"Shared plumbing for skills that report to the user through one private \"agent desk\" channel. Posts an alert there through an incoming webhook (scripts/notify.py). For any message that tags other people (an MR review request, a testing request), it never sends: it creates a ready Slack draft in the target channel, with the suggested people and the reasons, so the user edits and sends it themselves. It notices the user's thread replies and when the user has sent the draft (by a watch where the calling skill or the user turns one on, otherwise when the user says so in the terminal), and hands the final channel and people back to the calling skill. Load it from monitor-dev-ci, monitor-stage-ci, mr-review-request, or any skill that tells the user something and lets them decide what goes to a team channel.","stage":"operate","pitch":"One private channel where long-running skills report back, and whose alert threads act as a remote control: reply from Slack to steer the run. Messages that tag other people become drafts you send yourself, never sends. Slack is polled only where it pays: the CI monitors watch by default, everything else waits for you to say 'sent'.","when":"Used by the CI and review-request skills; load it from any skill that needs to tell you something while you are away, or take commands back from you.","example":"Post a test alert to my agent desk","needs":["Slack webhook","Slack connector (drafts)"],"generic":"partial","genericNote":"notify.py works with any Slack webhook. Discord, Teams, ntfy and terminal-only fallbacks are planned.","feeds":["mr-review-request","monitor-dev-ci","monitor-stage-ci"]},{"name":"confluence-review","description":"Review a Confluence document (PRD, design doc, runbook, ADR, spec) for completeness, correctness, ambiguity, staleness, and structure, and emit a severity-ranked report. Use when the user shares an atlassian.net/wiki URL or Confluence page ID, names a page to review (\"review the X design doc\"), or asks to check a Confluence spec before refinement or implementation. Doc-only by default; optionally grounds claims against Jira issues and local repos under ~/dev/repos when explicitly asked. Local report by default; posts a comment back to the Confluence page only when explicitly requested and only after verifying the page version is still current.","stage":"plan","pitch":"A severity-ranked review of a PRD, design doc, runbook or ADR: completeness, correctness, ambiguity, staleness.","when":"Before refinement or implementation starts on a spec, or when a doc may have gone stale.","example":"Review this design doc before we start: https://<site>.atlassian.net/wiki/spaces/ENG/pages/123","needs":["Confluence","Jira (optional)"],"generic":"ready","genericNote":"Works for any Confluence Cloud user. Notion, Google Docs and Markdown sources are planned (as doc-review).","feeds":["jira-story-estimation"]},{"name":"guided-mr-review","description":"Guide the user through reviewing a GitLab merge request themselves, instead of reviewing it for them. Produces a one-screen Review Brief listing what has already been verified (so they can skip it) and the 2–5 places that need human judgement, ranked by risk. Each place gets the question to answer, where to look and what each answer means for approval. With --walk, goes through those places one at a time, records the user's verdict
